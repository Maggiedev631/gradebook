<style>
/* 單一明亮主題。版面：頁首 → 黏頂統計格＋班級膠囊 → 學生列（名字｜備註｜搭來｜搭回） */
:root{
  --bg:#fff9ec; --dot:#ffe9b3; --surface:#ffffff; --ink:#3b3350; --muted:#8a80a0; --line:#f1e4c9;
  --sun:#ffc93c; --sun-ink:#5a3d00; --sky:#4fb3ff; --pink:#ff7fa8;
  --yes:#1f9e63; --yes-bg:#d9f7e7; --no:#9a8fb0; --no-bg:#ece8f3;
  --par:#1f78c8; --par-bg:#e3f1ff; --leave:#e0507a; --leave-bg:#ffe1ea; --empty-bg:#f4f0fa;
  --round:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--dot) 1.5px,transparent 1.6px);background-size:22px 22px;color:var(--ink);font-family:var(--font);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:40px}
[hidden]{display:none!important}
.wrap{max-width:920px;margin:0 auto}
header{padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-family:var(--round);font-size:26px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.plate{display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:var(--sun-ink);font-size:13px;font-weight:700;padding:5px 12px 5px 8px;border-radius:999px;box-shadow:0 3px 0 #e8a800}
.plate svg{width:22px;height:22px}
.date{color:var(--pink)}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.me{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
#status{color:var(--sky);font-weight:500;background:var(--surface);border:2px solid #d6ecff;border-radius:999px;padding:4px 10px}
.link{font:inherit;font-size:12px;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer}
.gate{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:28px 20px;text-align:center;margin-top:20px}
.gate p{color:var(--muted);margin:8px 0 18px}
.btn{font:inherit;font-size:15px;font-weight:700;border:0;background:var(--sky);color:#fff;border-radius:999px;padding:11px 20px;cursor:pointer;box-shadow:0 3px 0 #2e8fd9}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.pink{background:var(--pink);box-shadow:0 3px 0 #d9567f}
.sticky{position:sticky;top:0;background:var(--bg);z-index:5;padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:6px;border-bottom:2px dashed var(--line)}
.totals{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.tot{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:7px 2px;text-align:center;min-width:0}
.tot b{display:block;font-family:var(--round);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.tot span{font-size:12px;color:var(--muted);white-space:nowrap}
button.tot{cursor:pointer;transition:transform .12s}
button.tot:hover{transform:translateY(-2px);border-color:var(--sun)}
button.tot span::after{content:" ›"}
.tot.all b{color:var(--sky)} .tot.go b{color:var(--yes)} .tot.par b{color:var(--par)} .tot.leave b{color:var(--leave)} .tot.blank b{color:#c98a00} .tot.skip b{color:#7a6f8f} .tot.nt b{color:#8b5cf6}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding-top:12px;padding-bottom:6px}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:9px 8px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:baseline;justify-content:center;min-width:0}
.chip small{font-size:14px;font-weight:500}
.chip small{color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);font-weight:700;box-shadow:0 3px 0 #e8a800}
.chip[aria-pressed="true"] small{color:var(--sun-ink)}
.chip.done{border-color:#a8e6c6}
.chip.done small::after{content:" ✓";color:var(--yes)}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted);align-items:center}
.legend i{font-style:normal;border-radius:8px;padding:2px 8px;font-weight:700}
.classhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:20px 0 8px;flex-wrap:wrap}
.classhead h2{margin:0;font-family:var(--round);font-size:20px;color:var(--sky)}
.classhead .meta{font-size:12px;color:var(--muted)}
.classhead .stat{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--surface);border-radius:999px;padding:3px 10px}
.list{background:var(--surface);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:max-content minmax(90px,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:2px dotted var(--line)}
.row.is-leave{background:#fff6f9}
.divider{font-size:12px;font-weight:700;color:var(--yes);background:#f3fbf6;padding:4px 14px;border-top:2px dashed #bfe8d0}
.btns{display:grid;grid-template-columns:repeat(4,100px);gap:6px}
.row:first-child{border-top:0}
.who{white-space:nowrap}
.who .zh{font-weight:700;font-size:16px}
.who .en{display:block;color:var(--muted);font-size:13px}
.note{display:block;width:100%;min-width:0;margin:0;font:inherit;font-size:14px;color:var(--ink);background:#fffdf6;border:2px dashed var(--line);border-radius:10px;padding:6px 9px}
.note::placeholder{color:#c2b9d3}
.note:focus{outline:none;border-style:solid;border-color:var(--sky)}
.note.has{background:#fff1c7;border-style:solid;border-color:#ffe08a;font-weight:700;color:#8a5a00}
.t{font:inherit;font-size:16px;font-weight:700;border:2px solid var(--line);border-radius:14px;min-height:54px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;background:var(--surface);color:var(--muted);transition:transform .1s;min-width:0}
.t:active{transform:scale(.94)}
.t span{white-space:nowrap}
.t.on{border-width:3px;box-shadow:0 3px 0 currentColor}
.t small{font-size:11px;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-go.on,.t-back.on{background:var(--yes-bg);border-color:#8fdcb4;color:var(--yes)}
.t-par.on{background:var(--par-bg);border-color:#9ccbf5;color:var(--par)}
.t-leave.on{background:var(--leave-bg);border-color:#ffadc4;color:var(--leave)}
.t-skip.on{background:#e6e2ee;border-color:#b9b0cc;color:#4f4566}
.t-skip{color:#8a80a0}
.t-go,.t-back{color:#5e9e80} .t-par{color:#5f8fbd} .t-leave{color:#d07895}
.t:focus-visible,.chip:focus-visible,.btn:focus-visible,.tot:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.help{font-size:12px;color:var(--muted);margin-top:10px}
/* 名單面板（在頁面裡展開，不用跳窗） */
.panel{background:var(--surface);border:3px solid var(--sun);border-radius:22px;margin-top:14px;scroll-margin-top:260px}
/* 選項列（點按鈕後在該學生下方展開） */
.pickrow{grid-column:1 / -1;background:#fffbef;border-top:2px dashed var(--line);padding:12px}
.pickrow .ptitle{font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pickrow .x{font:inherit;font-size:13px;border:0;background:var(--empty-bg);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer}
.pickrow .opts{grid-template-columns:repeat(4,1fr)}
@media (max-width:440px){.pickrow .opts{grid-template-columns:1fr 1fr}}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 18px 10px;border-bottom:2px dashed var(--line);flex-wrap:wrap}
.panel-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn.sm{font-size:14px;padding:8px 14px}
.sumline{display:flex;flex-wrap:wrap;gap:6px;padding:10px 18px 0}
.sumline span{background:#f3f8ff;color:var(--ink);border-radius:999px;padding:3px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.sumline span b{color:var(--sky)}
.card-head h2{margin:0;font-family:var(--round);font-size:22px}
.card-head h2 span{font-size:15px;color:var(--yes);margin-left:8px}
.card-body{overflow-y:auto;padding:12px 18px 20px}
.close{font:inherit;font-weight:700;border:0;background:var(--pink);color:#fff;border-radius:999px;padding:8px 16px;cursor:pointer}
.grp{padding-block:8px;border-top:2px dotted var(--line)}
.grp:first-child{border-top:0}
.grp b{font-size:15px;color:var(--sky)}
.grp b small{color:var(--muted);font-weight:500;margin-left:4px}
.grp p{margin:3px 0 0;line-height:1.8;font-size:15px}
.empty{color:var(--muted);font-size:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:inherit;font-size:19px;font-weight:700;border:3px solid transparent;border-radius:18px;height:66px;cursor:pointer}
.opt.y{background:var(--yes-bg);color:var(--yes)}
.opt.p{background:var(--par-bg);color:var(--par)}
.opt.n{background:var(--no-bg);color:#6f6488}
.opt.l{background:var(--leave-bg);color:var(--leave)}
.opt.clear{grid-column:1/-1;height:48px;font-size:15px;background:var(--surface);color:var(--muted);border:2px solid var(--line)}
.opt.on{border-color:currentColor}
textarea{width:100%;font:inherit;font-size:16px;border:2px solid var(--line);border-radius:14px;padding:10px;resize:vertical;min-height:84px;background:#fff}
textarea:focus{outline:none;border-color:var(--sky)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.quick button{font:inherit;font-size:14px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer}
.row-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:640px){.totals{grid-template-columns:repeat(4,1fr)}.tot b{font-size:20px}}
@media (max-width:640px){
  .sticky{position:static}
  .panel{scroll-margin-top:10px}
  .row{grid-template-columns:max-content minmax(0,1fr);row-gap:8px}
  .btns{grid-column:1 / -1;grid-template-columns:repeat(4,1fr)}
}
@media (max-width:440px){
  h1{font-size:22px}
  .chips{grid-template-columns:repeat(4,1fr);gap:6px}
  .chip{font-size:15px;padding:8px 2px;flex-direction:column;align-items:center;gap:0}
  .chip small{font-size:12px}
  .row{padding-inline:10px}
  .t{font-size:14px;min-height:50px;padding:2px}
  .btns{gap:4px}
  .tot span{font-size:11px}
}
@media (prefers-reduced-motion:reduce){.t,button.tot{transition:none}}
</style>
</head>

<div class="wrap">
  <header>

      <div class="sub">名間分校 · 需考英檢學生（不含 K1A、K1B、英檢班、國中班）</div>

  <section class="gate" id="gate" hidden>

  </section>

  <div id="app" hidden>
    <div class="sticky">
      <div class="totals">
        <div class="tot all"><b id="tAll">0</b><span>總人數</span></div>
        <button type="button" class="tot go" data-k="go"><b id="tGo">0</b><span>搭來</span></button>
        <button type="button" class="tot go" data-k="back"><b id="tBack">0</b><span>搭回</span></button>
        <button type="button" class="tot par" data-k="par"><b id="tPar">0</b><span>家長接送</span></button>
        <button type="button" class="tot leave" data-k="leave"><b id="tLeave">0</b><span>請假</span></button>
        <button type="button" class="tot blank" data-k="blank"><b id="tBlank">0</b><span>尚未填</span></button>
        <button type="button" class="tot nt" data-k="note"><b id="tNote">0</b><span>備註</span></button>
      </div>
      <div class="chips" id="chips" role="toolbar" aria-label="班級"></div>
    </div>

    <div class="legend">每位學生有四個按鈕，點一下選取（變色），再點一下取消。已填的學生 2 秒後會移到下面：<i style="background:var(--yes-bg);color:var(--yes)">搭來</i><i style="background:var(--yes-bg);color:var(--yes)">搭回</i><i style="background:var(--par-bg);color:var(--par)">家長接送</i><i style="background:var(--leave-bg);color:var(--leave)">請假</i></div>

    <section class="panel" id="sheet" hidden>
      <div class="card-head"><h2 id="sheetTitle"></h2><div class="panel-actions"><button type="button" class="btn ghost sm" id="sheetCopy">複製文字</button><button type="button" class="btn sm" id="sheetDl">下載這份名單</button><button type="button" class="close" id="sheetClose">關閉</button></div></div>
      <div class="sumline" id="sheetSum"></div>
      <div class="card-body" id="sheetBody"></div>
    </section>

    <div id="main"></div>

    <div class="tools">
      <button class="btn" id="exportBtn" type="button">下載統計（Excel 可開）</button>
    </div>
    <p class="help">上方數字可以點，會列出那些學生。兩位老師同時操作會即時同步。</p>
  </div>
</div>

function stat(c){
  const r={n:c.st.length,go:0,back:0,par:0,leave:0,skip:0,blank:0,note:0};
  c.st.forEach(s=>{ const x=S(s.id);
    if(x.go)r.go++; if(x.back)r.back++; if(x.par)r.par++; if(x.leave)r.leave++; if(x.skip)r.skip++; if(!filled(x))r.blank++; if(x.note)r.note++; });
  return r;
}
const scope = () => cur==="ALL" ? ROSTER : ROSTER.filter(c=>c.c===cur);

function renderTotals(){
  const t={n:0,go:0,back:0,par:0,leave:0,skip:0,blank:0,note:0};

function optBtn(s,k,label){
  const x=S(s.id), on=!!x[k], b=document.createElement("button");
  b.type="button"; b.className="t t-"+k+(on?" on":""); b.disabled=!canWrite;
  b.setAttribute("aria-pressed",on);
  const sp=document.createElement("span"); sp.textContent=label; b.appendChild(sp);
  if(k==="leave" && on){ const sm=document.createElement("small"); sm.textContent=x.reason||"寫原因"; b.appendChild(sm); }
  b.onclick=()=>{
    if(k==="leave"){ open = {id:s.id, draft:x.reason||""}; render(); focusOpen(); return; }
    const patch={[k]:!on};
    if(!on && k==="skip"){ Object.assign(patch,{go:false,back:false,par:false,leave:false,reason:""}); }
    else if(!on){ patch.skip=false; if(x.leave){ patch.leave=false; patch.reason=""; } }
    save(s.id,patch);
  };

}

let ORDER={}, ORDER_FILLED={}, resortTimer=null;
function orderOf(c){
  if(!ORDER[c.c]){
    const a=c.st.filter(s=>!filled(S(s.id))), b=c.st.filter(s=>filled(S(s.id)));
    ORDER[c.c]=a.concat(b); ORDER_FILLED[c.c]=b.length;
  }
  return ORDER[c.c];
}
function scheduleResort(ms){
  clearTimeout(resortTimer);
  resortTimer=setTimeout(()=>{ if(open || (document.activeElement&&document.activeElement.classList.contains("note"))){ scheduleResort(1500); return; }

    c.onclick=()=>{ open=null; save(s.id,{leave:false,reason:""}); }; acts.appendChild(c); }
  const ok=document.createElement("button"); ok.type="button"; ok.className="btn pink"; ok.textContent=x.leave?"更新原因":"確定請假";
  ok.onclick=()=>{ const r=ta.value.trim(); open=null; save(s.id,{leave:true,reason:r,go:false,back:false,par:false,skip:false}); };
  acts.appendChild(ok); box.append(head,q,ta,acts);
  return box;
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&open){ open=null; render(); } });

/* ---------- 名單面板 ---------- */
let sheetKey=null;
const SHEET={
  go:   {t:"搭來",     pick:x=>!!x.go},
  back: {t:"搭回",     pick:x=>!!x.back},
  par:  {t:"家長接送", pick:x=>!!x.par},
  leave:{t:"請假",     pick:x=>!!x.leave, tag:x=>x.reason||"未寫原因"},
  skip: {t:"不考試",   pick:x=>!!x.skip},
  blank:{t:"尚未填",   pick:x=>!filled(x)}
};
function renderSheet(){
  const body=$("#sheetBody"); body.textContent="";
  let total=0, title; SHEET_ROWS=[]; const counts=[];
  if(sheetKey==="note"){
    title="備註統計"; const g={};
    scope().forEach(c=>c.st.forEach(s=>{const n=S(s.id).note; if(n)(g[n]=g[n]||[]).push(c.c+" "+nameOf(s));}));
    Object.keys(g).sort((a,b)=>g[b].length-g[a].length).forEach(k=>{ total+=g[k].length; counts.push([k,g[k].length]); g[k].forEach(n=>SHEET_ROWS.push([k,n,"",""])); body.appendChild(grp(k,g[k])); });
  } else {
    const cfg=SHEET[sheetKey]; title=cfg.t;
    scope().forEach(c=>{
      const who=c.st.filter(s=>cfg.pick(S(s.id)));
      if(!who.length) return; total+=who.length; counts.push([c.c,who.length]);
      who.forEach(s=>{ const x=S(s.id); SHEET_ROWS.push([c.c,s.zh,s.en,[cfg.tag?cfg.tag(x):"", sheetKey!=="leave"?x.note:""].filter(Boolean).join("，")]); });
      body.appendChild(grp(c.c, who.map(s=>{ const x=S(s.id); const tg=[cfg.tag?cfg.tag(x):"", sheetKey!=="leave"?x.note:""].filter(Boolean).join("，");
        return nameOf(s)+(tg?"（"+tg+"）":""); })));
    });
  }
  if(!total){ const e=document.createElement("p"); e.className="empty"; e.textContent="目前沒有學生"; body.appendChild(e); }
  const h=$("#sheetTitle"); h.textContent=title+(cur!=="ALL"?" · "+cur:"");
  const sp=document.createElement("span"); sp.textContent="共 "+total+" 人"; h.appendChild(sp);
  SHEET_TITLE=title; SHEET_TOTAL=total; SHEET_COUNTS=counts;
  const sum=$("#sheetSum"); sum.textContent="";
  counts.forEach(([k,n])=>{ const e=document.createElement("span"); const b=document.createElement("b"); b.textContent=k; e.append(b," "+n+" 人"); sum.appendChild(e); });
}
let SHEET_ROWS=[], SHEET_TITLE="", SHEET_TOTAL=0, SHEET_COUNTS=[];
function sheetText(){
  const lines=["11/7 模擬考 "+SHEET_TITLE+"：共 "+SHEET_TOTAL+" 人"];
  SHEET_COUNTS.forEach(([k,n])=>{ const names=SHEET_ROWS.filter(r=>r[0]===k).map(r=>(r[1]+(r[2]?" "+r[2]:""))+(r[3]?"（"+r[3]+"）":""));
    lines.push(k+"（"+n+" 人）："+names.join("、")); });
  return lines.join("\n");
}
$("#sheetCopy").onclick=async()=>{
  const txt=sheetText(), btn=$("#sheetCopy");
  try{ await navigator.clipboard.writeText(txt); btn.textContent="已複製 ✓"; }
  catch(_){ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); btn.textContent="已複製 ✓";}catch(__){} ta.remove(); }
  setTimeout(()=>btn.textContent="複製文字",1800);
};
$("#sheetDl").onclick=()=>{
  const isNote=sheetKey==="note";
  const rows=[["11/7 模擬考 "+SHEET_TITLE,"共 "+SHEET_TOTAL+" 人"],[],
    isNote?["備註","班級 姓名"]:["班級","姓名","英文名",sheetKey==="leave"?"請假原因":"說明"]];
  SHEET_ROWS.forEach(r=>rows.push(isNote?[r[0],r[1]]:r));
  rows.push([]); rows.push([isNote?"備註":"班級","人數"]); SHEET_COUNTS.forEach(c=>rows.push(c)); rows.push(["合計",SHEET_TOTAL]);
  dlCsv(rows,"11-7模擬考_"+SHEET_TITLE+".csv");
};
function grp(label,names){
  const g=document.createElement("div"); g.className="grp";
  const b=document.createElement("b"); b.textContent=label; const sm=document.createElement("small"); sm.textContent=names.length+" 人"; b.appendChild(sm);
  const p=document.createElement("p"); p.textContent=names.join("、"); g.append(b,p); return g;
}
document.querySelectorAll("button.tot").forEach(b=>b.addEventListener("click",()=>{
  sheetKey=b.dataset.k; renderSheet(); const p=$("#sheet"); p.hidden=false; p.scrollIntoView({behavior:"smooth",block:"start"}); }));
$("#sheetClose").onclick=()=>{ sheetKey=null; $("#sheet").hidden=true; };

/* ---------- 儲存 ---------- */
function setStatus(t){ $("#status").textContent=t; }
async function save(id,patch){
  state[id]={...S(id),...patch}; render(); scheduleResort(2000);
  if(!fs) return;
  try{
    await fs.collection(COL).doc(id).set({...patch, at:firebase.firestore.FieldValue.serverTimestamp(), by:(auth.currentUser&&auth.currentUser.email)||""},{merge:true});
  }catch(e){
    setStatus(e.code==="permission-denied" ? "沒有修改權限（請確認資料庫規則）" : "儲存失敗，請檢查網路");
  }
}

/* ---------- 下載 ---------- */
$("#exportBtn").onclick=()=>{
  const f=v=>v?"✓":"";
  const rows=[["班級","姓名","英文名","搭來","搭回","家長接送","請假","請假原因","備註"]];
  ROSTER.forEach(c=>c.st.forEach(s=>{const x=S(s.id); rows.push([c.c,s.zh,s.en,f(x.go),f(x.back),f(x.par),f(x.leave),x.reason||"",x.note||""]);}));
  rows.push([]); rows.push(["班級","人數","搭來","搭回","家長接送","請假","未填"]);
  ROSTER.forEach(c=>{const s=stat(c); rows.push([c.c,s.n,s.go,s.back,s.par,s.leave,s.blank]);});
  for(const k of ["go","back","par","leave"]){
    const cfg=SHEET[k]; rows.push([]); rows.push([cfg.t+"名單","姓名","英文名","說明"]);
    ROSTER.forEach(c=>c.st.forEach(s=>{const x=S(s.id); if(cfg.pick(x)) rows.push([c.c,s.zh,s.en,cfg.tag?cfg.tag(x):(x.note||"")]);}));
  }
  const ng={}; ROSTER.forEach(c=>c.st.forEach(s=>{const n=S(s.id).note; if(n)(ng[n]=ng[n]||[]).push(c.c+" "+s.zh);}));
  rows.push([]); rows.push(["備註統計","人數","名單"]); Object.keys(ng).forEach(k=>rows.push([k,ng[k].length,ng[k].join("、")]));
  dlCsv(rows,"11-7模擬考搭車統計.csv");
};
function dlCsv(rows,name){
  const csv="﻿"+rows.map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download=name; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- 登入與同步 ---------- */
function start(){
  $("#gate").hidden=true; $("#app").hidden=false; canWrite=true; render();
  if(unsub) unsub();
  const timer=setTimeout(()=>setStatus("連不上資料庫，請檢查網路"),10000);
  let firstSnap=true;
  unsub=fs.collection(COL).onSnapshot(snap=>{
    clearTimeout(timer);
    snap.docChanges().forEach(ch=>{ if(ch.type==="removed") delete state[ch.doc.id]; else state[ch.doc.id]=ch.doc.data(); });
    setStatus(snap.metadata.hasPendingWrites?"儲存中…":"已同步 · 即時更新");
    if(firstSnap){ firstSnap=false; ORDER={}; ORDER_FILLED={}; } else scheduleResort(2000);
    render();
  }, err=>{ clearTimeout(timer);
    if(err.code==="permission-denied"){ setStatus("沒有讀取權限"); $("#app").hidden=true; $("#gate").hidden=false;
      $("#gateMsg").textContent="這個帳號還沒有權限。請確認 Firebase 資料庫規則已加入這個 Email："+((auth.currentUser&&auth.currentUser.email)||""); }
    else setStatus("同步中斷，請重新整理"); });
}
if(window.firebase && window.FIREBASE_CONFIG.apiKey){
  firebase.initializeApp(window.FIREBASE_CONFIG); fs=firebase.firestore(); auth=firebase.auth();
  $("#login").onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err=>{
    if(err.code==="auth/popup-blocked"||err.code==="auth/operation-not-supported-in-this-environment") auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
    else if(err.code!=="auth/popup-closed-by-user"&&err.code!=="auth/cancelled-popup-request") $("#gateMsg").textContent="登入失敗："+err.message; });
  $("#logout").onclick=()=>auth.signOut();
  auth.onAuthStateChanged(u=>{
    if(u){ $("#who").textContent=u.email; $("#logout").hidden=false; start(); }
    else { if(unsub){unsub();unsub=null;} $("#who").textContent=""; $("#logout").hidden=true; $("#app").hidden=true; $("#gate").hidden=false; setStatus("尚未登入"); }
  });
} else {
  setStatus("離線預覽（未連資料庫）"); $("#gate").hidden=true; $("#app").hidden=false; canWrite=true; render();
}
</script>
